<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="CAS award medal" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFFF8A"/><stop offset=".45" stop-color="#6BAA1C"/><stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
    <radialGradient id="disc" cx=".4" cy=".3" r=".9">
      <stop offset="0" stop-color="#1f5a2a"/><stop offset=".6" stop-color="#0d2a14"/><stop offset="1" stop-color="#071009"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BD83A"/><stop offset="1" stop-color="#2E8B2E"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f6d6"/><stop offset="1" stop-color="#6BAA1C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <ellipse id="l" cx="100" cy="22" rx="3.6" ry="8.5" fill="url(#leaf)" transform="rotate(32 100 22)"/>
  </defs>

  <!-- outer ring -->
  <circle cx="100" cy="100" r="97" fill="url(#ring)"/>
  <circle cx="100" cy="100" r="92" fill="#0a1d10"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#9BD83A" stroke-opacity=".5" stroke-width=".8" stroke-dasharray="1.2 3.2"/>

  <!-- laurel, right and left -->
  <g>
    <use href="#l" transform="rotate(38 100 100)"/><use href="#l" transform="rotate(54 100 100)"/>
    <use href="#l" transform="rotate(70 100 100)"/><use href="#l" transform="rotate(86 100 100)"/>
    <use href="#l" transform="rotate(102 100 100)"/><use href="#l" transform="rotate(118 100 100)"/>
    <use href="#l" transform="rotate(134 100 100)"/>
  </g>
  <g transform="translate(200 0) scale(-1 1)">
    <use href="#l" transform="rotate(38 100 100)"/><use href="#l" transform="rotate(54 100 100)"/>
    <use href="#l" transform="rotate(70 100 100)"/><use href="#l" transform="rotate(86 100 100)"/>
    <use href="#l" transform="rotate(102 100 100)"/><use href="#l" transform="rotate(118 100 100)"/>
    <use href="#l" transform="rotate(134 100 100)"/>
  </g>

  <!-- inner disc -->
  <circle cx="100" cy="100" r="64" fill="url(#disc)" stroke="#6BAA1C" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#2E8B2E" stroke-opacity=".6" stroke-width=".8"/>

  <!-- circuit traces with 45-degree bends -->
  <g fill="none" stroke="#9BD83A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".9">
    <path d="M84 100 H66 L58 92"/>
    <path d="M84 108 H72 L64 116 H58"/>
    <path d="M116 100 H134 L142 92"/>
    <path d="M116 108 H128 L136 116 H142"/>
    <path d="M100 84 V70 L108 62"/>
    <path d="M100 116 V130 L92 138"/>
  </g>
  <g fill="#CFFF8A">
    <circle cx="58" cy="92" r="2.6"/><circle cx="58" cy="116" r="2.6"/>
    <circle cx="142" cy="92" r="2.6"/><circle cx="142" cy="116" r="2.6"/>
    <circle cx="108" cy="62" r="2.6"/><circle cx="92" cy="138" r="2.6"/>
  </g>

  <!-- central chip -->
  <g fill="url(#chip)">
    <rect x="90" y="80" width="3" height="6" rx="1"/><rect x="96" y="80" width="3" height="6" rx="1"/><rect x="102" y="80" width="3" height="6" rx="1"/><rect x="108" y="80" width="3" height="6" rx="1"/>
    <rect x="90" y="114" width="3" height="6" rx="1"/><rect x="96" y="114" width="3" height="6" rx="1"/><rect x="102" y="114" width="3" height="6" rx="1"/><rect x="108" y="114" width="3" height="6" rx="1"/>
    <rect x="80" y="90" width="6" height="3" rx="1"/><rect x="80" y="96" width="6" height="3" rx="1"/><rect x="80" y="102" width="6" height="3" rx="1"/><rect x="80" y="108" width="6" height="3" rx="1"/>
    <rect x="114" y="90" width="6" height="3" rx="1"/><rect x="114" y="96" width="6" height="3" rx="1"/><rect x="114" y="102" width="6" height="3" rx="1"/><rect x="114" y="108" width="6" height="3" rx="1"/>
  </g>
  <rect x="85" y="85" width="30" height="30" rx="6" fill="#0b3d16" stroke="#CFFF8A" stroke-opacity=".7" stroke-width="1.2"/>
  <rect x="91" y="91" width="18" height="18" rx="3" fill="#6BAA1C"/>
  <path d="M100 93.5 l2.1 4.4 4.8.6 -3.5 3.3 .9 4.8 -4.3-2.4 -4.3 2.4 .9-4.8 -3.5-3.3 4.8-.6z" fill="#071009"/>

  <!-- top and bottom diamonds -->
  <path d="M100 8 l4 5 -4 5 -4-5z" fill="#CFFF8A"/>
  <path d="M100 182 l4 5 -4 5 -4-5z" fill="#CFFF8A" transform="translate(0 -5)"/>

  <!-- glass sheen -->
  <path d="M30 78 A74 74 0 0 1 150 38 A90 90 0 0 0 30 78z" fill="url(#sheen)" opacity=".55"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
